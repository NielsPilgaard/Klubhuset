# Production docker-compose for deployment on OVH VPS via Dokploy.
#
# Dokploy provides Traefik as the reverse proxy — no separate proxy container needed.
# HTTPS certificates are managed by Dokploy/Traefik automatically.
#
# All secrets are injected via environment variables — never stored in this file.
# See the security checklist in tasks/phase-0-foundation.md before going live.
#
# Required environment variables (set in Dokploy dashboard):
#   DATABASE_URL                  — connection string from Dokploy Postgres database resource
#   KEYCLOAK_DB_URL               — connection string for Keycloak's Postgres database (JDBC format)
#   KEYCLOAK_ADMIN_PASSWORD       — strong random secret
#   SMTP_USERNAME                 — Scaleway TEM SMTP username
#   SMTP_PASSWORD                 — Scaleway TEM SMTP API key
#   Keycloak_AdminClientId        — Keycloak service account client ID (skoleplanen-admin)
#   Keycloak_AdminClientSecret    — rotate via Keycloak admin UI → Clients → skoleplanen-admin → Credentials
#   Keycloak_WebClientId          — Keycloak public client ID (skoleplanen-web)
#
# Optional overrides:
#   API_IMAGE                — defaults to ghcr.io/nielspilgaard/skoleplanen-api:latest
#   WEB_IMAGE                — defaults to ghcr.io/nielspilgaard/skoleplanen-web:latest

name:
  skoleplanen

  # Postgres is managed as a dedicated Database resource in Dokploy.
  # Dokploy injects the connection strings below as environment variables.
  # Do not add a postgres service here.

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-ghcr.io/nielspilgaard/skoleplanen-keycloak:latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      rollback_config:
        order: stop-first
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://auth.skoleplanen.dk
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.skoleplanen.dk`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  api:
    image: ${API_IMAGE:-ghcr.io/nielspilgaard/skoleplanen-api:latest}
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        order: start-first
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__skoleplanen-db: ${DATABASE_URL}
      Keycloak__Authority: https://auth.skoleplanen.dk/realms/Skoleplanen
      Keycloak__Audience: skoleplanen-api
      Keycloak__WebClientId: ${Keycloak_WebClientId}
      Keycloak__AdminClientId: ${Keycloak_AdminClientId}
      Keycloak__AdminClientSecret: ${Keycloak_AdminClientSecret}
      ObjectStorage__ServiceUrl: ${ObjectStorage_ServiceUrl}
      ObjectStorage__AccessKey: ${ObjectStorage_AccessKey}
      ObjectStorage__SecretKey: ${ObjectStorage_SecretKey}
      ObjectStorage__DefaultBucketName: ${ObjectStorage_DefaultBucketName}
      ObjectStorage__PublicEndpoint: ${ObjectStorage_PublicEndpoint}
      ObjectStorage__PresignedUploadSigningKey: ${ObjectStorage_PresignedUploadSigningKey}
      Smtp__Username: ${Smtp_Username}
      Smtp__Password: ${Smtp_Password}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      Stripe__SecretKey: ${Stripe_SecretKey}
      Stripe__PriceId: ${Stripe_PriceId}
      Stripe__WebhookSecret: ${Stripe_WebhookSecret}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /alive HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - dokploy-network
    depends_on:
      keycloak:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`skoleplanen.dk`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  web:
    image: ${WEB_IMAGE:-ghcr.io/nielspilgaard/skoleplanen-web:latest}
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - dokploy-network
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`skoleplanen.dk`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
    name: dokploy-network
