name: Staging
run-name: "Staging: ${{ github.event.workflow_run.head_commit.message && format('{0} ({1})', github.event.workflow_run.head_commit.message, github.event.workflow_run.head_sha) || github.event.workflow_run.head_sha }}"

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  e2e:
    name: E2E tests against staging stack
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull API and Keycloak images
        env:
          API_IMAGE: ghcr.io/nielspilgaard/skoleoverblikket-api:sha-${{ github.event.workflow_run.head_sha }}
          KEYCLOAK_IMAGE: ghcr.io/nielspilgaard/skoleoverblikket-keycloak:sha-${{ github.event.workflow_run.head_sha }}
          # WEB_IMAGE unused here — we build it locally with the staging Keycloak URL
          WEB_IMAGE: ghcr.io/nielspilgaard/skoleoverblikket-web:sha-${{ github.event.workflow_run.head_sha }}
        run: docker compose -f infrastructure/docker/docker-compose.staging.yml pull api keycloak keycloak-db postgres mailpit

      - name: Build web image with staging Keycloak URL
        # The published web image has the production Keycloak URL baked in (https://auth.skoleoverblikket.dk).
        # For e2e tests we need http://localhost:8080, so we rebuild locally.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: skoleoverblikket-web-e2e:latest
          build-args: |
            VITE_KEYCLOAK_URL=http://localhost:8080

      - name: Start staging stack
        env:
          API_IMAGE: ghcr.io/nielspilgaard/skoleoverblikket-api:sha-${{ github.event.workflow_run.head_sha }}
          WEB_IMAGE: skoleoverblikket-web-e2e:latest
          KEYCLOAK_IMAGE: ghcr.io/nielspilgaard/skoleoverblikket-keycloak:sha-${{ github.event.workflow_run.head_sha }}
        run: docker compose -f infrastructure/docker/docker-compose.staging.yml up -d --wait

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run Playwright e2e tests
        env:
          SKIP_ASPIRE: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          KEYCLOAK_ADMIN_PASSWORD: staging-admin-password
        run: npx playwright test --reporter=line
        working-directory: web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Tear down staging stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.staging.yml down -v
