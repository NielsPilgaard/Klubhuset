name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CI: true

jobs:
  api:
    name: API — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore api/Skoleplanen.Api/Skoleplanen.Api.csproj

      - name: Build
        run: dotnet build api/Skoleplanen.Api/Skoleplanen.Api.csproj --no-restore --configuration Release -p:CI=true

      - name: Test
        run: dotnet test --no-build --configuration Release
        # Tests live in sibling *Tests projects; when none exist yet this is a no-op.

      - name: Check OpenAPI spec is up to date
        run: |
          cp web/openapi/v1.json web/openapi/v1.json.committed
          dotnet build api/Skoleplanen.Api/Skoleplanen.Api.csproj --no-restore --configuration Release -p:CI=true
          diff web/openapi/v1.json.committed web/openapi/v1.json || (echo "OpenAPI spec is stale — run 'dotnet build' and commit web/openapi/v1.json" && exit 1)

  web:
    name: Web — build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Aspire CLI
        run: dotnet tool install -g aspire

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Start Aspire stack
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Parameters__keycloak-admin-password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: aspire run --project infrastructure/aspire/Skoleplanen.AppHost &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 && break
            echo "Waiting for frontend... ($i/60)"
            sleep 5
          done
          curl -sf http://localhost:5173 || (echo "Frontend did not start in time" && exit 1)

      - name: Run Playwright tests
        env:
          SKIP_ASPIRE: "1"
        run: npm run test:e2e
        working-directory: web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/

  publish:
    name: Publish container images
    runs-on: ubuntu-latest
    needs: [api, web, playwright]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ghcr.io/nielspilgaard/skoleplanen-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ghcr.io/nielspilgaard/skoleplanen-web:latest
