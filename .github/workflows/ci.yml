name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CI: true

jobs:
  api:
    name: API — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj

      - name: Format check
        run: dotnet format api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj --verify-no-changes

      - name: Build
        run: dotnet build api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj --no-restore --configuration Release -p:CI=true

      - name: Test
        run: dotnet run --project api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj --configuration Release --no-build

      - name: Check OpenAPI spec is up to date
        run: |
          cp web/openapi/v1.json web/openapi/v1.json.committed
          dotnet build api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj --no-restore --configuration Release -p:CI=true
          diff web/openapi/v1.json.committed web/openapi/v1.json || (echo "OpenAPI spec is stale — run 'dotnet build' and commit web/openapi/v1.json" && exit 1)

  web:
    name: Web — build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -f api/Skoleoverblikket.Api/Data/Migrations/migration_script.sql

  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest
    needs: [api, migrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-api:latest
            ghcr.io/nielspilgaard/skoleoverblikket-api:sha-${{ github.sha }}

  publish-web:
    name: Publish web image
    runs-on: ubuntu-latest
    needs: [web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-web:latest
            ghcr.io/nielspilgaard/skoleoverblikket-web:sha-${{ github.sha }}
          build-args: |
            VITE_KEYCLOAK_URL=https://auth.skoleoverblikket.dk

  publish-keycloak:
    name: Publish Keycloak image
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infrastructure/keycloak
          file: infrastructure/keycloak/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-keycloak:latest
            ghcr.io/nielspilgaard/skoleoverblikket-keycloak:sha-${{ github.sha }}
